[package]
name = "roblox-fast-flag-editor"
version = "2.0.0"
edition = "2024"
description = "Roblox Fast Flag Editor - Edit and apply Roblox client Fast Flags"
authors = ["diep"]
build = "build.rs"

[[bin]]
name = "roblox-fast-flag-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["ico"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
# Embeds icon + version info into the .exe as Win32 resources.
winres = "0.1"